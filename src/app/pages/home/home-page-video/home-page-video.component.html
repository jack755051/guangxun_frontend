<div class="title-container">
  <span>即時監控</span>
</div>
<div class="video-container">
  <div class="video-list-container">
    <mat-grid-list cols="2" rowHeight="16:9" gutterSize="1rem">
      <mat-grid-tile *ngFor="let video of videos; let i = index" (click)="toggleVideo(i)">
        <guangxun-video [video]="video"></guangxun-video>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
</div>
