<img [src]="image" [alt]="subTitle" />
<div class="content">
  <div class="text">
    <div class="title">{{ title }}</div>
    <div class="subTitle">{{ subTitle }}</div>
    <div class="description">{{ description }}</div>
  </div>
  <div class="tags">
    <guangxun-tag
      *ngFor="let tag of tags"
      [tag]="tag"
      [arrangeType]="arrangeType"
      (click)="onTagClick(tag)"
    ></guangxun-tag>
  </div>
</div>
