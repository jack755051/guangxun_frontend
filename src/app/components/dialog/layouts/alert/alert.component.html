<guangxun-dialog-shell>
  <div dialog-header>
    <fa-icon [icon]="getFaIcon(DialogType.ALERT).icon"></fa-icon>
    <h1>{{ data.header.title }}</h1>
  </div>
  å
  <div dialog-content>
    <guangxun-shell-content
      [type]="data.type"
      [content]="data.content ?? { type: 'text', text: '' }"
    ></guangxun-shell-content>
  </div>
  <div dialog-footer>
    <guangxun-shell-footer
      [type]="data.type"
      (closeDialog)="onDialogClose()"
    ></guangxun-shell-footer>
  </div>
</guangxun-dialog-shell>
